function renderR34List(srcId) {
  var box = $('r34List');
  if (!box) return;
  box.innerHTML = '';

  var pool = r34Pools[srcId] || [];
  var cnt = {}, i;
  for (i = 0; i < pool.length; i++) {
    if (pool[i].artist) cnt[pool[i].artist] = (cnt[pool[i].artist] || 0) + 1;
  }

  var st = mediaStats(pool);
  var arr = Object.keys(cnt).map(function (k) { return [k, cnt[k]]; });
  arr.sort(function (x, y) { return y[1] - x[1]; });
  arr = arr.slice(0, 40);

  var h = document.createElement('h3');
  h.textContent = '按作者筛选';
  box.appendChild(h);

  var note = document.createElement('div');
  note.style.cssText = 'font-size:12px;color:rgba(255,255,255,.45);line-height:1.8;'
    + 'margin:6px 0 2px;white-space:pre-line';
  note.textContent = '本次已见到 ' + pool.length + ' 张 · ' + Object.keys(cnt).length + ' 位作者\n'
    + '其中 图片 ' + st.img + ' · 视频 ' + st.vid + '\n'
    + '锁定后按 标签+作者 在线搜索';
  box.appendChild(note);

  var wrap = document.createElement('div');
  wrap.style.cssText = 'display:flex;flex-wrap:wrap;gap:8px;margin-top:10px';
  box.appendChild(wrap);

  if (!arr.length) {
    wrap.textContent = '还没抓到带作者名的图';
    wrap.style.color = 'rgba(255,255,255,.4)';
    wrap.style.fontSize = '13px';
    return;
  }

  arr.forEach(function (e) {
    var b = document.createElement('button');
    b.textContent = prettyArtist(e[0]) + ' (' + e[1] + ')';
    b.style.cssText = 'margin:0;padding:7px 14px;font-size:13px;border-radius:999px;'
      + 'background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.2);color:#fff';
    if (e[0] === lockedArtist) {
      b.style.background = 'rgba(34,211,238,.22)';
      b.style.borderColor = 'rgba(34,211,238,.6)';
      b.style.color = '#22d3ee';
    }
    b.addEventListener('click', function () {
      if (lockedArtist === e[0]) unlockArtist(); else lockArtist(e[0]);
      srcPanel.classList.add('hidden');
    });
    wrap.appendChild(b);
  });
}

function renderSrcPanel() {
  var s = source;
  $('indexBlock').classList.toggle('hidden', s !== 'e621');
  $('nekoBlock').classList.toggle('hidden', s !== 'nekos');

  var rb = $('r34Block');
  if (rb) {
    rb.classList.toggle('hidden', !r34Is(s));
    if (r34Is(s)) {
      $('r34Uid').value = r34Cfg.userId;
      $('r34Key').value = r34Cfg.apiKey;
      $('r34Msg').textContent = '';
      renderR34List(s);

  renderSwitchBtns();

function renderSwitchBtns() {
  var box = $('switchBtns');
  box.innerHTML = '';
  ['e621', 'r34dragon', 'r34scp', 'nekos'].forEach(function (k) {
    if (!SOURCES[k]) return;
    var b = document.createElement('button');
    b.textContent = (k === source ? '✓ ' : '') + r34Title(k);

    box.appendChild(b);

function updateSrcInfo() {
  var s = SOURCES[source];
  if (!s) { srcInfo.textContent = '—'; return; }
  srcInfo.textContent = '当前：' + r34Title(source) + '\n' + s.tip;
}

function updateChip() {
  if (r34Is(source)) { srcChip.textContent = r34Title(source); return; }
  if (source === 'nekos') { srcChip.textContent = 'nekos · ' + nekoCat; return; }
  if (!source) { srcChip.textContent = '—'; return; }

  var idx = loadIndex();
  if (!idx) { srcChip.textContent = r34Title('e621') + ' · 索引未建立'; return; }

  if (lockedArtist) {
    srcChip.textContent = r34Title('e621') + ' · ' + prettyArtist(lockedArtist)
      + ' ' + countOfArtist(idx.items, lockedArtist) + ' 张';
  } else {
    srcChip.textContent = r34Title('e621') + ' · ' + idx.items.length + ' 张' + (idx.partial ? '*' : '');
  }

function syncPlayBtn() {
  var v = window.video;
  if (!v || !current || !current.video) { playBtn.style.display = 'none'; return; }
  playBtn.style.display = 'flex';
  playBtn.style.alignItems = 'center';
  playBtn.style.justifyContent = 'center';
  playBtn.textContent = v.paused ? '▶' : '❚❚';
}

playBtn.addEventListener('pointerdown', function (e) { e.stopPropagation(); });

playBtn.addEventListener('click', function (e) {
  e.stopPropagation();
  var v = window.video;
  if (!v || !current || !current.video) return;

  if (v.paused) {
    v.muted = false;
    var pr = v.play();
    if (pr && pr.catch) pr.catch(function () {});
  } else {
    v.pause();
  }
  syncPlayBtn();
});

if (window.video) {
  window.video.addEventListener('play', syncPlayBtn);
  window.video.addEventListener('pause', syncPlayBtn);
}

function updateTypeBadge() {
  if (!current) {
    typeBadge.style.display = 'none';
    playBtn.style.display = 'none';
    return;
  }
  var isVid = current.video || isVideoFile(current.vurl || current.url);
  typeBadge.textContent = isVid ? '视频' : '图片';
  typeBadge.style.color = isVid ? '#ffd479' : '#22d3ee';
  typeBadge.style.display = '';
  syncPlayBtn();
}

showNext = async function () {
