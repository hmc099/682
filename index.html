function setIndicator(dir, progress) {
  var r = dir > 0 ? progress : 0;
  var l = dir < 0 ? progress : 0;
  glowRight.style.opacity = r; passLabel.style.opacity = r;
  glowLeft.style.opacity = l;  favLabel.style.opacity = l;
}
function resetIndicators() { setIndicator(0, 0); }

/* ==================== 滑动翻图 ==================== */
var THRESHOLD = 70;

card.addEventListener('pointerdown', function (e) {
  if (animating || artistDrag) return;
  dragging = true; startX = e.clientX; dx = 0;
  card.style.transition = 'none';
  try { card.setPointerCapture(e.pointerId); } catch (err) {}
});

card.addEventListener('pointermove', function (e) {
  if (!dragging) return;
  dx = e.clientX - startX;
  card.style.transform = 'translateX(' + dx + 'px) rotate(' + (dx / 22) + 'deg)';
  setIndicator(dx > 0 ? 1 : -1, Math.min(Math.abs(dx) / THRESHOLD, 1));
});

card.addEventListener('pointerup', endDrag);
card.addEventListener('pointercancel', endDrag);

function endDrag() {
  if (!dragging) return;
  dragging = false;

  if (Math.abs(dx) >= THRESHOLD) {
    var dir = dx > 0 ? 1 : -1;
    if (dir < 0) addFavorite();
    flyOut(dir);
  } else {
    card.style.transition = 'transform .3s cubic-bezier(.2,.9,.3,1)';
    card.style.transform = 'translateX(0) rotate(0)';
    resetIndicators();
  }
  dx = 0;
}

function flyOut(dir) {
  animating = true;
  setIndicator(dir, 1);
  card.style.transition = 'transform .3s ease-in, opacity .3s ease-in';
  card.style.transform = 'translateX(' + (dir * (window.innerWidth + 320)) + 'px) rotate(' + (dir * 20) + 'deg)';
  card.style.opacity = 0;

  setTimeout(async function () {
    resetIndicators();
    card.style.transition = 'none';
    card.style.transform = 'translateX(0) rotate(0) scale(.92)';
    card.style.opacity = 0;

    await showNext();
    void card.offsetWidth;

    card.style.transition = 'transform .28s cubic-bezier(.2,.9,.3,1), opacity .28s ease';
    card.style.transform = 'translateX(0) rotate(0) scale(1)';
    card.style.opacity = 1;

    setTimeout(function () { animating = false; }, 280);
  }, 300);
}

/* ==================== 拖作者名到顶部 ==================== */
function overLockBar(x, y) {
  var r = lockBar.getBoundingClientRect();
  return x >= r.left - 10 && x <= r.right + 10
      && y >= r.top - 40 && y <= r.bottom + 40;
}

artistName.addEventListener('pointerdown', function (e) {
  if (!current || !current.artist) return;
  if (e.pointerType === 'mouse' && e.button !== 0) return;

  e.stopPropagation();
  artistDrag = true;
  adX = e.clientX; adY = e.clientY;
  artistName.classList.add('grabbing');
  artistName.style.transition = 'none';
  try { artistName.setPointerCapture(e.pointerId); } catch (err) {}
});

artistName.addEventListener('pointermove', function (e) {
  if (!artistDrag) return;
  var mx = e.clientX - adX, my = e.clientY - adY;
  artistName.style.transform = 'translate(' + mx + 'px,' + my + 'px) scale(1.06)';
  lockBar.classList.toggle('dropping', overLockBar(e.clientX, e.clientY));
});

function endArtistDrag(e) {
  if (!artistDrag) return;
  artistDrag = false;
  artistName.classList.remove('grabbing');

  var over = e && overLockBar(e.clientX, e.clientY);
  lockBar.classList.remove('dropping');

  artistName.style.transition = 'transform .25s cubic-bezier(.2,.9,.3,1)';
  artistName.style.transform = '';

  if (over && current && current.artist) {
    if (navigator.vibrate) { try { navigator.vibrate(30); } catch (err) {} }
    lockArtist(current.artist);
  }
}

artistName.addEventListener('pointerup', endArtistDrag);
artistName.addEventListener('pointercancel', function () { endArtistDrag(null); });
artistName.addEventListener('contextmenu', function (e) { e.preventDefault(); });

/* ==================== 锁定 / 解锁作者 ==================== */
function updateLockBar() {
  if (lockedArtist) {
    lockBar.classList.add('locked');
    lockSlot.textContent = prettyArtist(lockedArtist);
  } else {
    lockBar.classList.remove('locked');
    lockSlot.textContent = '拖作者名到这里锁定';
  }
}

function lockArtist(name) {
  if (!name || name === lockedArtist) return;
  lockedArtist = name;
  updateLockBar();
  deck = [];
  updateChip();
  showNext();
}

function unlockArtist() {
  if (!lockedArtist) return;
  lockedArtist = null;
  updateLockBar();
  deck = [];
  updateChip();
  showNext();
}

lockClear.addEventListener('click', function (e) {
  e.stopPropagation();
  if (lockedArtist) unlockArtist();
});

/* ==================== 收藏 ==================== */
function addFavorite() {
  if (!current) return;
  if (favorites.some(function (f) { return f.id === current.id; })) return;

  favorites.push({
    id: current.id,
    url: current.url,
    preview: current.preview,
    video: current.video || false,
    artist: current.artist || '',
    source: current.source
  });

  try { localStorage.setItem(favKeyOf(source), JSON.stringify(favorites)); } catch (e) {}
  updateFavCount();
}

function updateFavCount() { favCountEl.textContent = favorites.length; }

/* ==================== 收藏夹面板动画 ==================== */
var EASE = 'cubic-bezier(.22,.9,.28,1)';

function openFavorites() {
  if (favAnimating || favOpen) return;
  favAnimating = true;
  favOpen = true;

  renderFavList();
  favBody.scrollTop = 0;
  favOverlay.classList.remove('contentIn');

  var vw = window.innerWidth, vh = window.innerHeight;
  var chipRect = favBadge.getBoundingClientRect();

  favOverlay.style.transition = 'none';
  favTitle.style.transition = 'none';
  favOverlay.style.display = 'block';
  favOverlay.style.top = '0px';
  favOverlay.style.left = '0px';
  favOverlay.style.width = vw + 'px';
  favOverlay.style.height = vh + 'px';
  favOverlay.style.borderRadius = '0px';
  favTitle.style.transform = 'none';

  var titleRect = favTitle.getBoundingClientRect();

  favOverlay.style.top = chipRect.top + 'px';
  favOverlay.style.left = chipRect.left + 'px';
  favOverlay.style.width = chipRect.width + 'px';
  favOverlay.style.height = chipRect.height + 'px';
  favOverlay.style.borderRadius = '999px';

  var sx = chipRect.height / titleRect.height;
  var tx = (chipRect.left + 14) - titleRect.left;
  var ty = chipRect.top - titleRect.top;
  favTitle.style.transform = 'translate(' + tx + 'px,' + ty + 'px) scale(' + sx + ')';

  favBadge.style.visibility = 'hidden';
  void favOverlay.offsetWidth;

  favOverlay.style.transition = 'top .46s ' + EASE + ', left .46s ' + EASE
    + ', width .46s ' + EASE + ', height .46s ' + EASE + ', border-radius .46s ' + EASE;
  favTitle.style.transition = 'transform .46s ' + EASE;

  favOverlay.style.top = '0px';
  favOverlay.style.left = '0px';
  favOverlay.style.width = vw + 'px';
  favOverlay.style.height = vh + 'px';
  favOverlay.style.borderRadius = '0px';
  favTitle.style.transform = 'none';

  setTimeout(function () {
    favOverlay.classList.add('contentIn');
    favAnimating = false;
  }, 460);
}

function closeFavorites() {
  if (favAnimating || !favOpen) return;
  favAnimating = true;
  favOpen = false;

  favOverlay.classList.remove('contentIn');

  setTimeout(function () {
    var chipRect = favBadge.getBoundingClientRect();
    var titleRect = favTitle.getBoundingClientRect();
    var sx = chipRect.height / titleRect.height;
    var tx = (chipRect.left + 14) - titleRect.left;
    var ty = chipRect.top - titleRect.top;

    favOverlay.style.transition = 'top .42s ' + EASE + ', left .42s ' + EASE
      + ', width .42s ' + EASE + ', height .42s ' + EASE + ', border-radius .42s ' + EASE;
    favTitle.style.transition = 'transform .42s ' + EASE;

    favOverlay.style.top = chipRect.top + 'px';
    favOverlay.style.left = chipRect.left + 'px';
    favOverlay.style.width = chipRect.width + 'px';
    favOverlay.style.height = chipRect.height + 'px';
    favOverlay.style.borderRadius = '999px';
    favTitle.style.transform = 'translate(' + tx + 'px,' + ty + 'px) scale(' + sx + ')';

    setTimeout(function () {
      favOverlay.style.display = 'none';
      favOverlay.style.transition = 'none';
      favTitle.style.transition = 'none';
      favBadge.style.visibility = 'visible';
      favAnimating = false;
    }, 430);
  }, 130);
